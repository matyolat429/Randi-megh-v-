<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Date? ❤️</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  color:#432;
}
.card{
  background:white;
  width:min(90%,430px);
  padding:30px 22px;
  border-radius:28px;
  text-align:center;
  box-shadow:0 20px 60px rgba(80,20,40,.25);
}
.heart{font-size:60px}
h1{font-size:28px}
p{font-size:18px;line-height:1.5}
button,input{
  font:inherit;
  padding:14px 18px;
  margin:7px;
  border:0;
  border-radius:15px;
}
button{
  font-weight:bold;
  cursor:pointer;
}
.yes{
  background:#ff4f81;
  color:white;
}
.no{
  background:#eee;
  color:#555;
  position:relative;
}
.option{
  display:block;
  width:90%;
  margin:10px auto;
  background:#f8e9ed;
  color:#633;
}
.option.selected{
  background:#ff4f81;
  color:white;
}
.hidden{display:none}
.date{width:90%}
</style>
</head>

<body>

<div class="card">

<section id="page1">

<div class="heart">❤️</div>

<h1>Would you like to go on a date with me?</h1>

<p>I have a very important question...</p>

<button class="yes" onclick="showPage(2)">
Yes 😍
</button>

<button class="no" id="noButton">
No 😢
</button>

<p id="message"></p>

</section>


<section id="page2" class="hidden">

<div class="heart">📅</div>

<h1>When should our date be?</h1>

<p>Choose the date!</p>

<input
  class="date"
  id="date"
  type="date"
>

<br>

<button class="yes" onclick="nextDate()">
Next ❤️
</button>

</section>


<section id="page3" class="hidden">

<div class="heart">🥰</div>

<h1>What should we do?</h1>

<button class="option" onclick="chooseActivity(this,'☕ Coffee')">
☕ Coffee
</button>

<button class="option" onclick="chooseActivity(this,'🎬 Cinema')">
🎬 Cinema
</button>

<button class="option" onclick="chooseActivity(this,'⛳ Golf')">
⛳ Golf
</button>

<button class="option" onclick="chooseActivity(this,'🌳 Walk')">
🌳 Walk
</button>

<br>

<button
  id="finishButton"
  class="yes hidden"
  onclick="finish()">
Done! ❤️
</button>

</section>


<section id="page4" class="hidden">

<div class="heart">💖</div>

<h1>Congratulations! 🎉</h1>

<p><b>It's officially a date! ❤️</b></p>

<p id="result"></p>

<p>
Your choice has been sent. 😊
</p>

</section>


<form
  id="emailForm"
  action="https://formsubmit.co/matyas.ovadi@gmail.com"
  method="POST"
  style="display:none;">

<input
  type="hidden"
  name="Date"
  id="emailDate">

<input
  type="hidden"
  name="Activity"
  id="emailActivity">

<input
  type="hidden"
  name="_subject"
  value="💕 New date choice!">

<input
  type="hidden"
  name="_captcha"
  value="false">

</form>

</div>


<script>

let selectedDate = "";
let selectedActivity = "";


function showPage(number){

  for(let i=1;i<=4;i++){

    document
      .getElementById("page"+i)
      .classList.add("hidden");

  }

  document
    .getElementById("page"+number)
    .classList.remove("hidden");

}


/* NO BUTTON */

let noClicks = 0;

document
  .getElementById("noButton")
  .onclick = function(){

    noClicks++;

    let size = Math.max(
      0.2,
      1 - noClicks * 0.16
    );

    this.style.transform =
      "scale(" + size + ")";

    this.style.left =
      (Math.random()*150-75) + "px";

    this.style.top =
      (Math.random()*60-30) + "px";

    document
      .getElementById("message")
      .textContent =
      noClicks > 3
      ? "The No button is disappearing... 😂"
      : "Are you sure? 😏";

};


/* DATE */

function nextDate(){

  let date =
    document.getElementById("date").value;

  if(!date){

    alert("Please choose a date! ❤️");

    return;

  }

  selectedDate = date;

  showPage(3);

}


/* ACTIVITY */

function chooseActivity(button,activity){

  document
    .querySelectorAll(".option")
    .forEach(function(b){

      b.classList.remove("selected");

    });

  button.classList.add("selected");

  selectedActivity = activity;

  document
    .getElementById("finishButton")
    .classList.remove("hidden");

}


/* DATE FORMAT */

function formatDate(date){

  let parts = date.split("-");

  let year = parts[0];
  let month = Number(parts[1]);
  let day = Number(parts[2]);

  return month + "/" + day + "/" + year;

}


/* FINISH */

function finish(){

  let niceDate =
    formatDate(selectedDate);

  document
    .getElementById("result")
    .innerHTML =
      "📅 <b>" + niceDate + "</b><br>" +
      "✨ <b>" + selectedActivity + "</b>";

  document
    .getElementById("emailDate")
    .value = niceDate;

  document
    .getElementById("emailActivity")
    .value = selectedActivity;

  showPage(4);

  setTimeout(function(){

    document
      .getElementById("emailForm")
      .submit();

  },500);

}

</script>

</body>
</html>
