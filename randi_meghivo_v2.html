<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randi ❤️</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial;background:linear-gradient(135deg,#ff9a9e,#fad0c4);color:#432}main{background:#fff;padding:30px 22px;border-radius:28px;text-align:center;width:min(88%,420px);box-shadow:0 20px 60px #7333}button,input{font:inherit;padding:14px 18px;margin:7px;border:0;border-radius:15px}button{font-weight:bold;cursor:pointer}.yes{background:#ff4f81;color:#fff}.no,.opt{background:#f3e8eb;color:#633}.opt{display:block;width:90%;margin:10px auto}.sel{background:#ff4f81;color:#fff}.hide{display:none}.heart{font-size:60px}#no{position:relative}</style></head><body><main>
<section id="s1"><div class="heart">❤️</div><h1>Eljössz velem randizni?</h1><button class="yes" onclick="show(2)">Igen 😍</button><button class="no" id="no">Nem 😢</button><p id="m"></p></section>
<section id="s2" class="hide"><div class="heart">📅</div><h1>Mikor legyen?</h1><p>Válaszd ki a dátumot!</p><input id="date" type="date"><br><button class="yes" onclick="nextDate()">Tovább ❤️</button></section>
<section id="s3" class="hide"><div class="heart">🥰</div><h1>Mit csináljunk?</h1><button class="opt" onclick="act(this,'☕ Kávézás')">☕ Kávézás</button><button class="opt" onclick="act(this,'🎬 Mozi')">🎬 Mozi</button><button class="opt" onclick="act(this,'⛳ Golf')">⛳ Golf</button><button class="opt" onclick="act(this,'🌳 Séta')">🌳 Séta</button><br><button id="fin" class="yes hide" onclick="send()">Kész! ❤️</button></section>
<section id="s4" class="hide"><div class="heart">💖</div><h1>Gratulálunk! 🎉</h1><p><b>Megvan a randi! ❤️</b></p><p id="res"></p></section>
<form id="form" action="https://formsubmit.co/matyas.ovadi@gmail.com" method="POST" style="display:none"><input name="Randi dátuma" id="fd"><input name="Program" id="fa"><input type="hidden" name="_subject" value="💕 Új randi választás!"><input type="hidden" name="_captcha" value="false"></form>
</main><script>
let d="",a="";function show(n){for(let i=1;i<5;i++)document.getElementById('s'+i).classList.add('hide');document.getElementById('s'+n).classList.remove('hide')}
let n=0;document.getElementById('no').onclick=()=>{n++;document.getElementById('no').style.transform='scale('+Math.max(.2,1-n*.16)+')';document.getElementById('m').textContent=n>3?'A Nem gomb lassan eltűnik... 😂':'Biztos? 😏'};
function nextDate(){if(!date.value)return alert('Válassz dátumot! ❤️');d=date.value;show(3)}function act(x,v){document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));x.classList.add('sel');a=v;fin.classList.remove('hide')}
function send(){let [y,m,dd]=d.split('-'),nice=y+'. '+(+m)+'. '+(+dd)+'.';fd.value=nice;fa.value=a;res.innerHTML='📅 <b>'+nice+'</b><br>✨ <b>'+a+'</b>';show(4);form.submit()}
</script></main></body></html>
