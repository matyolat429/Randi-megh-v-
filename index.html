<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meghívó</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: #432;
}

.card {
  background: white;
  width: min(90%, 430px);
  padding: 30px 22px;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(80, 20, 40, .25);
}

.heart {
  font-size: 60px;
}

h1 {
  font-size: 28px;
}

button,
input {
  font: inherit;
  padding: 14px 18px;
  margin: 7px;
  border: 0;
  border-radius: 15px;
}

button {
  font-weight: bold;
  cursor: pointer;
}

.yes {
  background: #ff4f81;
  color: white;
}

.no {
  background: #eee;
  color: #555;
  position: relative;
}

.option {
  display: block;
  width: 90%;
  margin: 10px auto;
  background: #f8e9ed;
  color: #633;
}

.option.selected {
  background: #ff4f81;
  color: white;
}

.hidden {
  display: none;
}

.date {
  width: 90%;
}
</style>
</head>

<body>

<div class="card">

<!-- 1. KÉRDÉS -->
<section id="page1">

<div class="heart">❤️</div>

<h1>Eljössz velem randizni?</h1>

<p>Van egy nagyon fontos kérdésem...</p>

<button class="yes" onclick="showPage(2)">
Igen 😍
</button>

<button class="no" id="noButton">
Nem 😢
</button>

<p id="message"></p>

</section>


<!-- 2. DÁTUM -->
<section id="page2" class="hidden">

<div class="heart">📅</div>

<h1>Mikor legyen a randi?</h1>

<p>Válaszd ki a dátumot!</p>

<input
  class="date"
  id="date"
  type="date"
>

<br>

<button class="yes" onclick="nextDate()">
Tovább ❤️
</button>

</section>


<!-- 3. PROGRAM -->
<section id="page3" class="hidden">

<div class="heart">🥰</div>

<h1>Mit csináljunk?</h1>

<button class="option" onclick="chooseActivity(this,'☕ Kávézás')">
☕ Kávézás
</button>

<button class="option" onclick="chooseActivity(this,'🎬 Mozi')">
🎬 Mozi
</button>

<button class="option" onclick="chooseActivity(this,'⛳ Golf')">
⛳ Golf
</button>

<button class="option" onclick="chooseActivity(this,'🌳 Séta')">
🌳 Séta
</button>

<br>

<button
  id="finishButton"
  class="yes hidden"
  onclick="finish()">
Kész! ❤️
</button>

</section>


<!-- 4. VÉGEREDMÉNY -->
<section id="page4" class="hidden">

<div class="heart">💖</div>

<h1>Gratulálunk! 🎉</h1>

<p><b>Megvan a randi! ❤️</b></p>

<p id="result"></p>

<p>
A választásod elküldve. 😊
</p>

</section>


<!-- E-MAIL KÜLDÉS -->
<form
  id="emailForm"
  action="https://formsubmit.co/matyas.ovadi@gmail.com"
  method="POST"
  style="display:none;">

  <input
    type="hidden"
    name="Randi dátuma"
    id="emailDate">

  <input
    type="hidden"
    name="Program"
    id="emailActivity">

  <input
    type="hidden"
    name="_subject"
    value="💕 Új randi választás!">

  <input
    type="hidden"
    name="_captcha"
    value="false">

</form>

</div>


<script>

let selectedDate = "";
let selectedActivity = "";


/* OLDALVÁLTÁS */

function showPage(number) {

  for (let i = 1; i <= 4; i++) {
    document
      .getElementById("page" + i)
      .classList.add("hidden");
  }

  document
    .getElementById("page" + number)
    .classList.remove("hidden");
}


/* NEM GOMB */

let noClicks = 0;

document
  .getElementById("noButton")
  .onclick = function () {

    noClicks++;

    let size = Math.max(
      0.2,
      1 - noClicks * 0.16
    );

    this.style.transform =
      "scale(" + size + ")";

    this.style.left =
      (Math.random() * 150 - 75) + "px";

    this.style.top =
      (Math.random() * 60 - 30) + "px";

    document.getElementById("message")
      .textContent =
      noClicks > 3
      ? "A Nem gomb lassan eltűnik... 😂"
      : "Biztos? 😏";
};


/* DÁTUM */

function nextDate() {

  let date =
    document.getElementById("date").value;

  if (!date) {
    alert("Válassz egy dátumot! ❤️");
    return;
  }

  selectedDate = date;

  showPage(3);
}


/* PROGRAM */

function chooseActivity(button, activity) {

  document
    .querySelectorAll(".option")
    .forEach(function (b) {
      b.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedActivity = activity;

  document
    .getElementById("finishButton")
    .classList.remove("hidden");
}


/* DÁTUM FORMÁZÁSA */

function formatDate(date) {

  let parts = date.split("-");

  let year = parts[0];
  let month = Number(parts[1]);
  let day = Number(parts[2]);

  return year + ". " + month + ". " + day + ".";
}


/* KÉSZ */

function finish() {

  let niceDate =
    formatDate(selectedDate);

  document.getElementById("result").innerHTML =
    "📅 <b>" + niceDate + "</b><br>" +
    "✨ <b>" + selectedActivity + "</b>";

  document.getElementById("emailDate").value =
    niceDate;

  document.getElementById("emailActivity").value =
    selectedActivity;

  showPage(4);

  /*
    Elküldi az adatokat a Gmail címre.
  */

  setTimeout(function () {

    document
      .getElementById("emailForm")
      .submit();

  }, 500);
}

</script>

</body>
</html>
